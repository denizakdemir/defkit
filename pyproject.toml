[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defkit"
version = "0.1.0"
description = "Shared primitives for comparing statistical experiments: deficiency solvers, probability distances, Gaussian closed forms."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Deniz Akdemir", email = "deniz.akdemir.work@gmail.com" }]
dependencies = ["numpy>=1.22", "scipy>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
cvxpy = ["cvxpy>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
